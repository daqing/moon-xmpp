name: CI

on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Cache MoonBit toolchain and dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.moon
            .mooncakes
          key: moonbit-${{ runner.os }}-${{ hashFiles('moon.mod') }}
          restore-keys: |
            moonbit-${{ runner.os }}-

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update MoonBit dependencies
        run: |
          moon version --all
          moon update

      - name: Run tests
        run: moon test
